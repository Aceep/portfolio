<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      `/` serves the front-end positioning, so that is what ships statically.
      `/cyber` gets its own document, generated from this one at build time by
      scripts/build-routes.mjs, because link scrapers do not run JS. Both are
      also swapped at runtime by src/i18n/meta.ts, which is what follows the
      language toggle once React is up.
    -->
    <title>Alycia Gautier — Développeuse Front-End React &amp; TypeScript</title>
    <meta
      name="description"
      content="Développeuse front-end, deux ans d’interfaces React, TypeScript, Vue et Tailwind livrées en production. En recherche d’un CDI à partir de septembre 2026, Paris ou télétravail."
    />
    <meta name="author" content="Alycia Gautier" />
    <meta name="theme-color" content="#171715" />

    <!--
      Absolute URLs, not root-relative: LinkedIn and Facebook resolve og:image
      against nothing and drop the preview entirely if it is relative.
      Canonical + og:url collapse the catch-all rewrite in vercel.json, which
      answers every unmatched path with a 200. Both are rewritten per route at
      runtime by src/i18n/meta.ts.
    -->
    <link rel="canonical" href="https://portfolio-topaz-zeta-15.vercel.app/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Alycia Gautier — Développeuse Front-End React &amp; TypeScript" />
    <meta
      property="og:description"
      content="Deux ans d'interfaces React, TypeScript, Vue et Tailwind livrées en production. En recherche d'un CDI à partir de septembre 2026."
    />
    <meta property="og:url" content="https://portfolio-topaz-zeta-15.vercel.app/" />
    <meta property="og:image" content="https://portfolio-topaz-zeta-15.vercel.app/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alycia Gautier — Développeuse Front-End React &amp; TypeScript" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alycia Gautier — Développeuse Front-End React &amp; TypeScript" />
    <meta
      name="twitter:description"
      content="Deux ans d'interfaces React, TypeScript, Vue et Tailwind livrées en production. CDI recherché à partir de septembre 2026."
    />
    <meta name="twitter:image" content="https://portfolio-topaz-zeta-15.vercel.app/og-card.png" />
    <meta name="twitter:image:alt" content="Alycia Gautier — Développeuse Front-End React &amp; TypeScript" />

    <!--
      Person schema. og:type is already "profile"; this is the structured
      equivalent search engines actually read. Swapped for the cyber
      positioning by the prerender step in vite.config.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "url": "https://portfolio-topaz-zeta-15.vercel.app/",
        "mainEntity": {
          "@type": "Person",
          "name": "Alycia Gautier",
          "jobTitle": "Développeuse Front-End",
          "url": "https://portfolio-topaz-zeta-15.vercel.app/",
          "email": "mailto:alycia.gautier@laposte.net",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Paris",
            "addressCountry": "FR"
          },
          "knowsLanguage": ["fr", "en"],
          "knowsAbout": [
            "React",
            "TypeScript",
            "JavaScript",
            "Vue.js",
            "Tailwind CSS",
            "HTML",
            "CSS",
            "Jest",
            "Accessibilité web"
          ],
          "alumniOf": {
            "@type": "EducationalOrganization",
            "name": "École 42"
          },
          "sameAs": [
            "https://www.linkedin.com/in/alycia-gautier/",
            "https://github.com/Aceep"
          ]
        }
      }
    </script>

    <!--
      Fonts are self-hosted (scripts/vendor-fonts.mjs writes src/styles/fonts.css).
      Linking fonts.googleapis.com here meant a render-blocking stylesheet on a
      third-party origin — DNS, TLS and a round trip before first paint.
      These two carry the headings and every mono label, so they are preloaded.
    -->
    <link
      rel="preload"
      href="/fonts/syne-800-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
