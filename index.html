<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/Kyle.png" />

    <!--
      `/` serves the front-end positioning, so that is what ships statically —
      link scrapers do not run JS. The `/cyber` variant swaps title and
      description at runtime (see src/i18n/meta.ts).
    -->
    <title>Alycia Gautier — Développeuse Front-End React &amp; TypeScript</title>
    <meta
      name="description"
      content="Développeuse front-end, deux ans d'interfaces React, TypeScript, Vue et Tailwind livrées en production. En recherche d'un CDI à partir de septembre 2026, Paris ou télétravail."
    />
    <meta name="author" content="Alycia Gautier" />
    <meta name="theme-color" content="#171715" />

    <!--
      Absolute URLs, not root-relative: LinkedIn and Facebook resolve og:image
      against nothing and drop the preview entirely if it is relative.
      Canonical + og:url collapse the catch-all rewrite in vercel.json, which
      answers every unmatched path with a 200. Both are rewritten per route at
      runtime by src/i18n/meta.ts.
    -->
    <link rel="canonical" href="https://portfolio-topaz-zeta-15.vercel.app/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Alycia Gautier — Développeuse Front-End React &amp; TypeScript" />
    <meta
      property="og:description"
      content="Deux ans d'interfaces React, TypeScript, Vue et Tailwind livrées en production. En recherche d'un CDI à partir de septembre 2026."
    />
    <meta property="og:url" content="https://portfolio-topaz-zeta-15.vercel.app/" />
    <meta property="og:image" content="https://portfolio-topaz-zeta-15.vercel.app/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alycia Gautier — Développeuse Front-End React &amp; TypeScript" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alycia Gautier — Développeuse Front-End React &amp; TypeScript" />
    <meta
      name="twitter:description"
      content="Deux ans d'interfaces React, TypeScript, Vue et Tailwind livrées en production. CDI recherché à partir de septembre 2026."
    />
    <meta name="twitter:image" content="https://portfolio-topaz-zeta-15.vercel.app/og-card.png" />
    <meta name="twitter:image:alt" content="Alycia Gautier — Développeuse Front-End React &amp; TypeScript" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
